[package]
name = "matenadar-wasm"
description = "Matenadar in WebAssembly: lay out, edit and render a document in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []
# Typst's own faces as a fallback (about 5 MB more). Without them every
# font the document uses must be given.
embedded-fonts = ["matenadar-typst/embedded-fonts", "matenadar-epub/embedded-fonts"]

[dependencies]
matenadar-model.workspace = true
matenadar-typst.workspace = true
matenadar-epub.workspace = true
typst.workspace = true
serde_json.workspace = true
