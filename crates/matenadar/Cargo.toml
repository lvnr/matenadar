[package]
name = "matenadar"
description = "A typesetting engine for anything that prints, for people and agents: document model, Typst layout, EPUB 3 export, and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "rendering", "text-processing"]

[features]
default = ["typst", "epub", "embedded-fonts", "cli"]
typst = ["dep:matenadar-typst"]
epub = ["typst", "dep:matenadar-epub"]
embedded-fonts = ["matenadar-typst?/embedded-fonts", "matenadar-epub?/embedded-fonts"]
cli = ["typst", "epub", "dep:anyhow"]

[lib]
name = "matenadar"
path = "src/lib.rs"

[[bin]]
name = "matenadar"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
matenadar-model.workspace = true
matenadar-typst = { workspace = true, optional = true }
matenadar-epub = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
