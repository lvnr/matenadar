[package]
name = "matenadar-epub"
description = "EPUB 3 from a Matenadar document: reflowable, or one image per page"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["embedded-fonts"]
# Typst's own faces as a fallback; the WebAssembly build leaves them out.
embedded-fonts = ["matenadar-typst/embedded-fonts"]

[dependencies]
matenadar-model.workspace = true
matenadar-typst = { path = "../matenadar-typst", default-features = false }
ttf-parser = "0.25"
indexmap.workspace = true
typst.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = "1"
crc32fast = "1"

[dev-dependencies]
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
