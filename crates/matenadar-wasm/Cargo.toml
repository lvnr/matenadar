[package]
name = "matenadar-wasm"
description = "Matenadar in WebAssembly: lay out, edit and render a document in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = []
# Typst's own faces as a fallback (about 5 MB more). Without them every
# font the document uses must be given.
embedded-fonts = ["matenadar-typst/embedded-fonts", "matenadar-epub/embedded-fonts"]

[dependencies]
matenadar-model.workspace = true
matenadar-typst = { path = "../matenadar-typst", default-features = false }
matenadar-epub = { path = "../matenadar-epub", default-features = false }
typst.workspace = true
serde_json.workspace = true
